[package]
name = "oma-channel"
version = "0.1.0"
edition = "2021"
description = "Rust backend for the Oma Channel Omarchy bar plugin"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
feed-rs = "2"
html-escape = "0.2"
opml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = "2"
infer = "0.22.0"
ksni = { version = "0.3.6", features = ["blocking"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
